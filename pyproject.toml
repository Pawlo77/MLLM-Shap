[project]
name = "mllm-shap-bachelor"
version = "0.1.0"
description = "Bachelor work code"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "mllm-shap",
  "datasets<4.0.0",
  "jupyter>=1.1.1,<2.0.0",
  "ipywidgets>=8.1.7,<9.0.0",
  "torch>=2.8.0,<3.0.0",
  "torchcodec>=0.7.0,<0.8.0",
  "librosa>=0.11.0,<0.12.0",
  "soundfile>=0.13.1,<0.14.0",
  "transformers>=4.50",
  "lingua-language-detector>=2.1.1,<3.0.0",
  "matplotlib>=3.10.6,<4.0.0",
  "pydantic>=2.11.10,<3.0.0",
  "nltk>=3.9.2,<4.0.0",
  "semhash>=0.3.2,<0.4.0",
  "pandas>=2.3.3,<3.0.0",
  "tqdm>=4.67.1,<5.0.0",
  "sentence-transformers>=5.1.1,<6.0.0",
  "seaborn>=0.13.2,<1.0.0",
  "googletrans>=4.0.2,<5.0.0",
  "google-cloud-texttospeech>=2.31.0,<3.0.0",
  "python-dotenv>=1.1.1,<2.0.0",
  "pydub>=0.25.1,<0.26.0",
  "grpcio>=1.76.0",
]

[tool.uv.sources]
mllm-shap = { workspace = true }

[dependency-groups]
dev = [
  "pre-commit>=4.3.0,<5.0.0",
  "black>=25.9.0,<26.0.0",
  "flake8>=7.3.0,<8.0.0",
  "isort>=6.1.0,<7.0.0",
  "autoflake>=2.3.1,<3.0.0",
  "pylint>=3.3.8,<4.0.0",
  "bandit>=1.8.6,<2.0.0",
  "mypy>=1.18.2,<2.0.0",
  "nbqa>=1.9.1,<2.0.0",
  "types-pygments==2.19.0.20250809",
  "types-colorama==0.4.15.20250801",
  "types-decorator==5.2.0.20250324",
  "types-jsonschema==4.25.1.20250822",
  "types-pexpect==4.9.0.20250916",
  "types-cachetools==6.2.0.20250827",
  "types-requests==2.32.4.20250913",
  "types-pyyaml==6.0.12.20250915",
  "types-simplejson==3.20.0.20250822",
  "types-tabulate>=0.9.0.20241207",
  "pytest>=8.4.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mllm_shap"]
