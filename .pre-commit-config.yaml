default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-xml

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.2
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: |
          isort
            --profile=black
            --multi-line=3
            --trailing-comma
            --force-grid-wrap=0
            --use-parentheses
            --ensure-newline-before-comments
            --line-length=120
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments|mllm_shap/tests)/.*\.py$.*\.py$
      - id: autoflake
        name: autoflake
        entry: |
          autoflake
            --in-place
            --remove-all-unused-imports
            --remove-unused-variables
            --exclude=__init__.py
            --expand-star-imports
            --ignore-init-module-imports
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments|mllm_shap/tests)/.*\.py$
      - id: flake8
        name: flake8
        entry: |
          flake8
            --max-line-length=120
            --ignore E402,W291,W503
        language: system
        types: [file, python]
        files: ^(mllm_shap/src|experiments|mllm_shap/tests)/.*\.py$
      - id: pylint
        name: pylint
        entry: |
          pylint
            --load-plugins=pylint.extensions.check_elif,pylint.extensions.docparams,pylint.extensions.magic_value
            --max-line-length=120
            --disable=fixme,duplicate-code
        language: system
        types: [file, python]
        files: ^(mllm_shap/src|experiments)/.*\.py$
      - id: bandit
        name: bandit
        entry: bandit
        language: system
        types: [file, python]
        files: ^(mllm_shap/src|experiments)/.*\.py$
      - id: mypy
        name: mypy
        entry: |
          mypy
            --strict
            --install-types
            --ignore-missing-imports
        language: system
        types: [python]
        files: ^(mllm_shap/src)/.*\.py$

  - repo: local
    hooks:
      - id: isort-nbqa
        name: isort-nbqa
        entry: |
          nbqa isort
            --profile=black
            --multi-line=3
            --trailing-comma
            --force-grid-wrap=0
            --use-parentheses
            --ensure-newline-before-comments
            --line-length=120
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments)/.*\.ipynb$
      - id: autoflake-nbqa
        name: autoflake-nbqa
        entry: |
          nbqa autoflake
            --in-place
            --remove-all-unused-imports
            --remove-unused-variables
            --exclude=__init__.py
            --expand-star-imports
            --ignore-init-module-imports
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments)/.*\.ipynb$
      - id: black-nbqa
        name: black-nbqa
        entry: |
          nbqa black
            --line-length=120
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments)/.*\.ipynb$
      - id: flake8-nbqa
        name: flake8-nbqa
        entry: |
          nbqa flake8
            --max-line-length=120
            --ignore=E402,W291,W503
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments)/.*\.ipynb$
      - id: pylint-nbqa
        name: pylint-nbqa
        entry: |
          nbqa pylint
            --load-plugins=pylint.extensions.check_elif,pylint.extensions.docparams,pylint.extensions.magic_value
            --max-line-length=120
            --disable=missing-module-docstring,wrong-import-position,pointless-statement,magic-value-comparison,expression-not-assigned
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments)/.*\.ipynb$
      - id: bandit-nbqa
        name: bandit-nbqa
        entry: nbqa bandit
        language: system
        types: [file]
        files: ^(mllm_shap/src|experiments)/.*\.ipynb$

  - repo: https://github.com/tconbeer/sqlfmt
    rev: v0.26.0
    hooks:
      - id: sqlfmt
        language_version: python
        additional_dependencies: [".[jinjafmt]"]
        files: ^.*/macros/.*\.sql$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: fix-byte-order-marker
