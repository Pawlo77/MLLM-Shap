name: Pytest data preparation

on:
  push:
    branches:
      - main
    paths:
      - "experiments/data_preparation/**"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/data_preparation/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: make install

      - name: Run data-preparation tests
        run: make -C experiments/data_preparation tests
